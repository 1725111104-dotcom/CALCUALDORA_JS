<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="main">
        <section class="calculadora">
            <label class="calculadora_result" id="pantalla">0</label>
            <button class="calculadora_button" onclick="agregar('1')">1</button>
            <button class="calculadora_button" onclick="agregar('2')">2</button>
            <button class="calculadora_button" onclick="agregar('3')">3</button>
            <button class="calculadora_button" onclick="agregar('+')">+</button>
            <button class="calculadora_button" onclick="agregar('4')">4</button>
            <button class="calculadora_button" onclick="agregar('5')">5</button>
            <button class="calculadora_button" onclick="agregar('6')">6</button>
            <button class="calculadora_button" onclick="agregar('-')">-</button>
            <button class="calculadora_button" onclick="agregar('7')">7</button>
            <button class="calculadora_button" onclick="agregar('8')">8</button>
            <button class="calculadora_button" onclick="agregar('9')">9</button>
            <button class="calculadora_button" onclick="agregar('/')">/</button>
            <button class="calculadora_button" onclick="limpiar()">C</button>
            <button class="calculadora_button" onclick="agregar('0')">0</button>
            <button class="calculadora_button" onclick="calcular()">=</button>
            <button class="calculadora_button" onclick="agregar('x')">x</button>
        </section>
    </main>

   <script src="app.js"></script> 
</body>
</html>
